{% assign m = include.m %}<a class="link-card mat-card" href="{% if m.url contains '://' %}{{ m.url }}{% else %}{{ m.url | relative_url }}{% endif %}">{% if m.thumb %}<img class="lc-img" src="{{ m.thumb | relative_url }}" alt="">{% endif %}<span class="lc-body"><span class="lc-site">{{ m.kicker }}</span><span class="lc-title">{{ m.title }}</span>{% if m.description %}<span class="lc-desc">{{ m.description }}</span>{% endif %}</span></a>
