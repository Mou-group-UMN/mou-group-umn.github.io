# Homepage content (Classic layout, direction A). The page itself is index.html.
statement: >-
  The Mou Group develops learning, optimization and computational methods for complex engineering systems,
  with the goal of improving their quality, productivity and efficiency. Our work draws on modern machine
  learning (modeling), large-scale optimization (algorithms) and computational science (efficient
  implementation), with applications in vision-based industrial inspection, advanced manufacturing, energy
  systems and more.
areas:   # chips under the statement; key = the area's anchor on the Research page
  - {key: robust, label: "Robust learning & anomaly detection"}
  - {key: design, label: "Physics-informed machine learning"}
  - {key: stochastic, label: "Stochastic systems & optimization"}
openings:
  title: We are recruiting Ph.D. students
  text: >-
    Students in statistics, mathematics, computer science, engineering or related majors with proficient
    coding skills are welcome to apply. Please email Prof. Mou at
    <a class="em" href="mailto:mou00006@umn.edu">mou00006@umn.edu</a> with your CV, plus transcripts or
    sample publications if available. Current UMN students and remote research assistants are also welcome
    to reach out.
sponsors:   # "Supported by" logo row at the bottom of the homepage; a logo shows once its file exists in the repo
  - {name: National Science Foundation, logo: /assets/img/sponsors/nsf.png, url: "https://www.nsf.gov/", height: 60}
  - {name: NVIDIA, logo: /assets/img/sponsors/nvidia.png, url: "https://www.nvidia.com/en-us/industries/higher-education-research/academic-grant-program/", height: 34}
  - {name: Samsung, logo: /assets/img/sponsors/samsung.png, url: "https://www.sait.samsung.co.kr/saithome/about/collabo_recipients.do", height: 44}
  - {name: "University of Minnesota Data Science Initiative", logo: /assets/img/sponsors/umn-dsi.png, url: "https://dsi.umn.edu/", height: 44}
