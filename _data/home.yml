# Homepage content (Classic layout, direction A). The page itself is index.html.
statement: >-
  The Mou Group develops learning, optimization and computational methods for complex engineering systems,
  with the goal of improving their quality, productivity and efficiency. Our work draws on modern machine
  learning (modeling), large-scale optimization (algorithms) and computational science (efficient
  implementation), with applications in vision-based industrial inspection, advanced manufacturing, energy
  systems and more.
practitioners: >-   # note under the statement (Sean, 2026-10-01); HTML allowed
  <strong>For practitioners:</strong> our work is industrial and physical AI, that is, AI that understands
  and improves real machines, plants and energy systems. It rests on three parts that need one another.
  Machine learning gives us a good model of the system. Optimization is the next stage: once the model is
  good, it finds the best designs, operating settings and controls. Efficient algorithms and computation
  then bring these advances into the real world, at the speed and scale that deployment demands.
openings:
  title: We are recruiting Ph.D. students
  topics:   # bullet points under the title (Sean, 2026-10-01); HTML allowed
    - '<strong>Agentic AI for industrial inspection and quality control in advanced manufacturing</strong>, as part of our NSF-funded <a href="/projects/#data-agent">Data-Agent</a> project, co-advised by Prof. Shancong (Sean) Mou (ISyE) and <a href="https://zirui-ray-liu.github.io/">Prof. Zirui Liu</a> (CS).'
    - 'We are also open to strong candidates with a solid numerical or mathematical background (for example, numerical analysis, PDEs or scientific computing) to work on <strong>physics-informed learning and large-scale optimization</strong>.'
  more: 'A few current student projects can be found on the <a href="/people/">People</a> page.'   # line after the bullets
  text: >-
    Students in statistics, mathematics, computer science, engineering or related majors with proficient
    coding skills are welcome to apply. Please email Prof. Shancong (Sean) Mou at
    <a class="em" href="mailto:mou00006@umn.edu">mou00006@umn.edu</a> with your CV, plus transcripts or
    sample publications if available. Current UMN students and remote research assistants are also welcome
    to reach out.
