  title: Computing Support
  text: 'In-kind cloud and GPU computing from the <a href="https://nairrpilot.org/">NSF National AI Research Resource (NAIRR) Pilot</a> and the <a href="https://www.nvidia.com/en-us/industries/higher-education-research/academic-grant-program/">NVIDIA Academic Grant Program</a>, supporting our work on data-centric AI, physics-informed AI and differentiable simulation.'
  funding_label: Awards
  funding:
    - '<strong>NSF NAIRR Pilot:</strong> $238,800 in AWS cloud credits (NAIRR250089; Co-PI) for a data-centric AI framework for defect detection in advanced manufacturing: automated data curation, annotation and design'
    - '<strong>NVIDIA Academic Grant Program:</strong><ul><li>30K A100 GPU hours (2025–2026) for automatic data quality evaluation and synthetic data generation, supporting the <a href="#big-vision">Big VISION Initiative</a></li><li>2 RTX 6000 Max-Q workstation GPUs (2026–2027) for physics-informed AI and differentiable simulation, supporting our <a href="#hvac">HVAC project</a> (a differentiable HVAC system simulator)</li></ul>'
